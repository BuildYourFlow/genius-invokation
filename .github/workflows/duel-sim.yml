name: Duel simulation experiment

on:
  push:
    paths:
      - 'scripts/duel-sim/**'
      - '.github/workflows/duel-sim.yml'
  workflow_dispatch:
    inputs:
      full_campaign:
        description: 'Run preregistered 2000 + 400 real games after smoke gates'
        type: boolean
        default: false

jobs:
  smoke-and-simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build engine packages
        run: |
          pnpm --filter @gi-tcg/config build
          pnpm --filter @gi-tcg/typings build
          pnpm --filter @gi-tcg/utils build
          pnpm --filter @gi-tcg/gts-runtime build
          pnpm --filter @gi-tcg/core build
          pnpm --filter @gi-tcg/data build
          pnpm --filter @gi-tcg/assets-manager build
      - name: Run 20-game real-engine smoke test
        env:
          GAMES: '20'
          BASE_SEED: '700012'
        run: node scripts/duel-sim/run.mjs
      - name: Validate common policies
        run: |
          node --test scripts/duel-sim/policy.test.mjs
          POLICY=greedy EXPERIMENT=smoke-greedy node scripts/duel-sim/run.mjs
          POLICY=resource EXPERIMENT=smoke-resource node scripts/duel-sim/run.mjs
          POLICY=greedy EXPERIMENT=replay-greedy node scripts/duel-sim/run.mjs
          node scripts/duel-sim/verify-replay.mjs
      - name: Full preregistered campaign
        if: github.event_name == 'workflow_dispatch' && inputs.full_campaign
        run: |
          node scripts/duel-sim/campaign.mjs
          node scripts/duel-sim/benchmark-policy.mjs 0
          node scripts/duel-sim/benchmark-policy.mjs 1
          node scripts/duel-sim/analyze.mjs
          node scripts/duel-sim/verify-results.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duel-sim-results
          path: results/duel-sim/**
          if-no-files-found: warn
