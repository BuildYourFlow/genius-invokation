name: Duel simulation experiment

on:
  push:
    paths:
      - 'scripts/duel-sim/**'
      - '.github/workflows/duel-sim.yml'
  workflow_dispatch:

jobs:
  smoke-and-simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.2.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build engine packages
        run: pnpm --filter @gi-tcg/typings build && pnpm --filter @gi-tcg/utils build && pnpm --filter @gi-tcg/gts-runtime build && pnpm --filter @gi-tcg/core build && pnpm --filter @gi-tcg/data build
      - name: Run duel simulation
        run: node scripts/duel-sim/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duel-sim-results
          path: results/duel-sim/**
          if-no-files-found: warn
